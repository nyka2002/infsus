<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RentIO – Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card">
                <div class="card-body text-center py-5">

                    <h4 th:if="${poruka}" th:text="${poruka}" class="text-success mb-3"></h4>

                    <div th:if="${processInstanceId}" class="alert alert-info">
                        <strong>Process Instance ID:</strong><br>
                        <code th:text="${processInstanceId}"></code>
                        <br><small class="text-muted">Spremi ovaj ID za sljedeće korake.</small>
                    </div>

                    <a href="/" class="btn btn-primary me-2">Natrag na početak</a>
                    <a href="http://localhost:8080/camunda" target="_blank" class="btn btn-outline-secondary">
                        Camunda Cockpit →
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
